name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x86
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -A Win32

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PawnJIT-windows-x86
          path: |
            build/RelWithDebInfo/PawnJIT.dll
            build/RelWithDebInfo/PawnJIT.pdb
          if-no-files-found: error

  build-linux:
    name: Linux x86
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install 32-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib cmake ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PawnJIT-linux-x86
          path: build/PawnJIT.so
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/PawnJIT.dll
            release-files/PawnJIT.pdb
            release-files/PawnJIT.so
          generate_release_notes: true

  nightly:
    name: Update nightly release
    needs: [build-windows, build-linux]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Recreate nightly release
        run: |
          gh release delete nightly --repo "${{ github.repository }}" --cleanup-tag --yes || true
          gh release create nightly \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Nightly (${GITHUB_SHA::7})" \
            --notes "Latest nightly build from commit ${{ github.sha }}. May be unstable." \
            --prerelease \
            release-files/PawnJIT.dll \
            release-files/PawnJIT.pdb \
            release-files/PawnJIT.so
